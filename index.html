<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Company</title>

    <script type="module">
        import { init } from 'https://nagarrosoftwarepvtltddemo19.service-now.com/uxasset/externals/sn_embeddable_core/index.jsdbx';

        function getTokenCallBack() {
            return Promise.resolve('');
        }

        await init({
            theme: 'fad87d2ca304121029a4d1aed31e610f',
            baseURL: 'https://nagarrosoftwarepvtltddemo19.service-now.com',
            authCallback: getTokenCallBack,
            module: '87992d5a47868350aeb6abf9316d43b0',
            pageName: document.title
        });
    </script>
</head>

<body>

    <h1>ABC Company</h1>

    <!-- Case List -->
    <sn-embedx-case-list
        table="sn_customerservice_case"
        limit="5"
        list-title="List of Cases"
        columns="number,short_description,sys_updated_on,state">
    </sn-embedx-case-list>

    <script type="module">
        import {
            getEmbeddables,
            setEvents
        } from 'https://nagarrosoftwarepvtltddemo19.service-now.com/uxasset/externals/sn_embeddable_core/index.jsdbx';

        const caseList = document.querySelector('sn-embedx-case-list');

        getEmbeddables(['sn-embedx-case-list']);

        setEvents(caseList, {
            'SN_EMBEDX_CASE_LIST#RECORD_SELECTED': (e) => {
                const { table, record_sys_id } = e.detail.payload;

                const caseViewURL =
                    '/caseview.html?emb_table=' +
                    table +
                    '&emb_recordid=' +
                    record_sys_id;

                window.location.href = caseViewURL;
            },

            'SN_EMBEDX_CASE_LIST#COMPONENT_ERROR': (e) => {
                console.error('Case List Error:', e.detail.payload);
            }
        });
    </script>

    <!-- Case Form -->
    <sn-embedx-case-form
        sys-id="de45c412c312310015519f2974d3ae1b"
        confirmation-text="Case submitted successfully!"
        confirmation-sub-text="Estimated resolution in 24 hours">
    </sn-embedx-case-form>

    <script type="module">
        import {
            getEmbeddables
        } from 'https://nagarrosoftwarepvtltddemo19.service-now.com/uxasset/externals/sn_embeddable_core/index.jsdbx';

        getEmbeddables(['sn-embedx-case-form']);
    </script>

    <!-- Case View -->
    <sn-embedx-case-view
        table="sn_customerservice_case"
        table-view-for-related-list="4006fee3d7600200e5982cf65e6103de"
        header-configuration-id="1db45f9118520210f8775b8843daf927"
        action-configuration-id="b226535518520210f8775b8843daf9fb">
    </sn-embedx-case-view>

    <script type="module">
        import {
            getEmbeddables,
            setProperties
        } from 'https://nagarrosoftwarepvtltddemo19.service-now.com/uxasset/externals/sn_embeddable_core/index.jsdbx';

        const caseView = document.querySelector('sn-embedx-case-view');

        const params = new URLSearchParams(window.location.search);

        setProperties(caseView, {
            table: params.get('emb_table'),
            sysId: params.get('emb_recordid')
        });

        getEmbeddables(['sn-embedx-case-view']);
    </script>

</body>
</html>
