<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Company</title>
    <script type="module">
      import { init , login , logout } from 'https://nagarrosoftwarepvtltddemo19.service-now.com/uxasset/externals/sn_embeddable_core/index.jsdbx';
await init({
	theme: 'fad87d2ca304121029a4d1aed31e610f',  /* sys_id of the theme to use for the embeddable components in your website*/
	baseURL: 'https://nagarrosoftwarepvtltddemo19.service-now.com', /* Base URL of the instance to be used for the embeddable components in your website*/
	authCallback: getTokenCallBack, /* Function which returns the auth token for the current user, required for auth setup*/
	module: '87992d5a47868350aeb6abf9316d43b0', /* ABC Company Website*/
    pageName: document.title, /* Uses the browser's document title as the page name in User analytics experience*/
	// cacheComponents: ["sn-embedx-case-form","sn-embedx-case-list","sn-embedx-case-view","sn-embedx-catalog-browse","sn-embedx-catalog-item-form","903894c1b742301035a36161de11a992","sn-custom-embedx-incident-view","sn-embedx-kb-article-view","sn-embedx-object-list","sn-embedx-playbook-intake"] /* Pre-caches resources for improved performance. Update component list as per your usage */
});
function getTokenCallBack() {
	// TODO: this must return a real ServiceNow auth token for the current
	// logged-in user (e.g. an id_token from your login/SSO flow). Leaving
	// this undefined will fail auth for any component that needs a logged-in
	// user, and can itself cause an embed to render blank.
	var idToken;
	return Promise.resolve(idToken);
}
/* Uncomment below functions to handle login and logout once the user logs into your website */
// await login();
// await logout();
    </script>
</head>
<body>
    <h1>ABC Company</h1>
<!--  
    Module: ABC Company Website
    Group: Group 1
    Instance: Case list 1
-->
<sn-embedx-case-list
	table="sn_customerservice_case"
	limit="5"
	list-title="List of Cases"
	query="state=1^ORsys_created_onONThis month@javascript:gs.beginningOfThisMonth()@javascript:gs.endOfThisMonth()^ORsys_updated_onONToday@javascript:gs.beginningOfToday()@javascript:gs.endOfToday()"
	columns="number,short_description,sys_updated_on,state">
</sn-embedx-case-list>
<!--
	The component also includes the following additional properties:
	hide-header
	hide-last-refreshed-text
	hide-record-count
	hide-search
	hide-refresh
	show-filters
	hide-when-empty
	disable-column-resizing
	hide-errors
	view
-->
<script type="module">
	import { getEmbeddables, setEvents, setProperties } from 'https://nagarrosoftwarepvtltddemo19.service-now.com/uxasset/externals/sn_embeddable_core/index.jsdbx';
	
	const snEmbedxCaseList = document.querySelector('sn-embedx-case-list');
	getEmbeddables(["sn-embedx-case-list"]);
	const eventHandlers = {
		'SN_EMBEDX_CASE_LIST#RECORD_SELECTED' : (e) => {
			// This event is dispatched when a record is selected.
			var {table, record_sys_id} = e.detail.payload;
			// Sends the user to caseview.html (served at /caseview via
			// vercel.json's cleanUrls), which renders the sn-embedx-case-view
			// component for this specific record.
			const caseViewURL = '/caseview?emb_table='+table+'&emb_recordid='+record_sys_id;
			// Redirect to the Case View component page
			open(caseViewURL,'_self');
		},
		'SN_EMBEDX_CASE_LIST#COMPONENT_READY' : (e) => {
			// This event is dispatched when a component is ready and usable.
		},
		'SN_EMBEDX_CASE_LIST#COMPONENT_ERROR' : (e) => {
			// This event is dispatched when a property validation or internal error occurs.
			var {errorMessage, errorType} = e.detail.payload;
			console.log(errorMessage, errorType);
		}
	};
	setEvents(snEmbedxCaseList, eventHandlers);
</script>
    <!-- Case List -->

<!--  
    Module: ABC Company Website
    Group: Group 1
    Instance: Object list 1
-->
<sn-embedx-object-list
	type="default"
	table="incident"
	action-config="6316ec1355dd422a8ebfdeb6336b1179"
	child-records-per-load="10"
	max-cell-characters="500"
	records-per-page='[10,20,50]'
	visible-page-range="5"
	footer-text="View All"
	max-top-records="20"
	header-size="md"
	edit-query="active=true^assignment_groupISNOTEMPTY">
</sn-embedx-object-list>
<!--
	The component also includes the following additional properties:
	hide-header
	hide-record-count
	hide-search
	hide-filters
	disable-column-selection
	hide-actions
	max-columns-displayed
	hide-record-links
	show-reference-record-links
	disable-column-highlighting
	shade-alternate-rows
	hide-child-record-count
	disable-quick-edit
	disable-cell-wrapping
	disable-cell-editing
	hide-errors
	limit-records-fetched
	hide-page-size-control
	disable-cell-filtering
	disable-column-sorting
	disable-column-filtering
	disable-column-grouping
	show-condition-builder
	hide-refresh-button
	disable-title-wrap
	disable-column-resizing
	disable-column-drag-and-drop
	disable-row-drag-and-drop
	expand-groups-by-default
	hide-toggle-all-groups-button
	hide-when-empty
	default-filter
	columns
	list-view
	nest-by
	default-group-by
	list-title
	subtitle
	highlighted-value-config
-->
<script type="module">
	import { getEmbeddables, setEvents, setProperties } from 'https://nagarrosoftwarepvtltddemo19.service-now.com/uxasset/externals/sn_embeddable_core/index.jsdbx';
	
	const snEmbedxObjectList = document.querySelector('sn-embedx-object-list');
	getEmbeddables(["sn-embedx-object-list"]);
	const eventHandlers = {
		'SN_EMBEDX_OBJECT_LIST#FOOTER_LINK_SELECTED' : (e) => {
			// This event is dispatched when footer link is selected
			var {table, view, edit_query, nest_by} = e.detail.payload;
			// NOTE: no /objectlist page exists yet, so this "View All" footer
			// link will 404 until one is built (same pattern as caseview.html /
			// incidentview.html) \u2014 say if you want that added too.
			const objectListURL = '/objectlist?emb_table=' + table + '&emb_query=' + edit_query + '&emb_view=' + view + '&emb_nestby=' + nest_by;
			open(objectListURL, '_self');
		},
		'SN_EMBEDX_OBJECT_LIST#COMPONENT_ERROR' : (e) => {
			// This event is dispatched when a property validation or internal error occurs.
			var {errorMessage, errorType} = e.detail.payload;
			console.log(errorMessage, errorType);
		},
		'SN_EMBEDX_OBJECT_LIST#RECORD_SELECTED' : (e) => {
			// This event is dispatched when a record is selected.
			var {table, record_sys_id} = e.detail.payload;
			var RecordViewURL;
			if (table == 'sn_customerservice_case') {
				RecordViewURL = '/caseview?emb_table=' + table + '&emb_recordid=' + record_sys_id;
			} else if (table == 'incident') {
				// CHANGED: incidents now go to the incident-view page instead of
				// the generic /recordview page, which was never built.
				RecordViewURL = '/incidentview?emb_table=' + table + '&emb_recordid=' + record_sys_id;
			} else {
				RecordViewURL = '/recordview?emb_table=' + table + '&emb_recordid=' + record_sys_id;
			}
			open(RecordViewURL, '_self');
		},
		'SN_EMBEDX_OBJECT_LIST#COMPONENT_READY' : (e) => {
			// This event is dispatched when a component is ready and usable.
		}
	};
	setEvents(snEmbedxObjectList, eventHandlers);
</script>

</body>
</html>
