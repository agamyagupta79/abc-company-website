<script type="module">
	import { getEmbeddables, setEvents, setProperties } from 'https://nagarrosoftwarepvtltddemo19.service-now.com/uxasset/externals/sn_embeddable_core/index.jsdbx';
	
	const snEmbedxCaseList = document.querySelector('sn-embedx-case-list');
	getEmbeddables(["sn-embedx-case-list"]);
	const eventHandlers = {
		'SN_EMBEDX_CASE_LIST#RECORD_SELECTED' : (e) => {
			// This event is dispatched when a record is selected.
			var {table, record_sys_id} = e.detail.payload;
			// Sends the user to caseview.html (served at /caseview via
			// vercel.json's cleanUrls), which renders the sn-embedx-case-view
			// component for this specific record.
			const caseViewURL = '/caseview?emb_table='+table+'&emb_recordid='+record_sys_id;
			// Redirect to the Case View component page
			open(caseViewURL,'_self');
		},
		'SN_EMBEDX_CASE_LIST#COMPONENT_READY' : (e) => {
			// This event is dispatched when a component is ready and usable.
		},
		'SN_EMBEDX_CASE_LIST#COMPONENT_ERROR' : (e) => {
			// This event is dispatched when a property validation or internal error occurs.
			var {errorMessage, errorType} = e.detail.payload;
			console.log(errorMessage, errorType);
		}
	};
	setEvents(snEmbedxCaseList, eventHandlers);
</script>

<script type="module">
	import { getEmbeddables, setEvents, setProperties } from 'https://nagarrosoftwarepvtltddemo19.service-now.com/uxasset/externals/sn_embeddable_core/index.jsdbx';
	
	const snEmbedxVisualizationDonut = document.querySelector('sn-embedx-visualization-donut');
	// Grabbed directly (not shared from the object list's own script below \u2014
	// separate <script type="module"> blocks don't share top-level variables)
	// so this script can update the list's filter when a segment is clicked.
	const snEmbedxObjectList = document.querySelector('sn-embedx-object-list');
	const OBJECT_LIST_BASE_QUERY = 'active=true^assignment_groupISNOTEMPTY';

	getEmbeddables(["sn-embedx-visualization-donut"]);

	const eventHandlers = {
		'NOW_VIS_WRAPPER#PROPERTY_OVERRIDE' : (e) => {
			// Dispatched when the visualization overrides its property. For example when the user selects a different group by from the alternative group by selection
			var {properties} = e.detail.payload;
			console.log(properties);
		},
		'NOW_VIS_WRAPPER#SELECTED' : (e) => {
			// Dispatched when the user selects/de-selects element on data visualizations, typically to filter other content on the page
			var {title, type, isSelected, params, data} = e.detail.payload;
			// JSON.stringify so nothing gets truncated in the console this time.
			console.log('isSelected:', isSelected);
			console.log('params (full):', JSON.stringify(params, null, 2));
			console.log('data (full):', JSON.stringify(data, null, 2));
			console.log('object list element found:', !!snEmbedxObjectList);

			if (!snEmbedxObjectList) {
				console.log('BLOCKED: sn-embedx-object-list was not found on the page.');
				return;
			}

			if (!isSelected) {
				// Segment de-selected (clicked again) - back to the full list.
				console.log('Resetting object list filter to base query.');
				setProperties(snEmbedxObjectList, {
					editQuery: OBJECT_LIST_BASE_QUERY,
					refreshRequest: Date.now()
				});
				return;
			}

			if (params && params.query) {
				// Best case: ServiceNow already built the encoded query for us.
				console.log('Applying filter to object list:', params.query);
				setProperties(snEmbedxObjectList, {
					editQuery: params.query,
					// Some ServiceNow embeddables need an explicit "something
					// changed" signal to actually re-fetch after a property
					// update - refresh-request is documented on this
					// component for that purpose. A fresh value each call
					// (timestamp) ensures it's always seen as "new."
					refreshRequest: Date.now()
				});
				return;
			}

			// Fallback: params didn't include a ready-made query (or it was
			// truncated in devtools and we couldn't confirm it), so build the
			// filter from the clicked segment's label using ServiceNow's
			// standard incident "state" choice values. This assumes your
			// instance hasn't customized them - if the list doesn't match
			// after clicking, paste the "params (full)" log above and this
			// gets fixed to use the real field instead.
			if (data && data.elements && data.elements[0]) {
				const STATE_LABEL_TO_VALUE = {
					'New': '1',
					'In Progress': '2',
					'On Hold': '3',
					'Resolved': '6',
					'Closed': '7',
					'Cancelled': '8'
				};
				const clickedLabel = data.elements[0];
				const stateValue = STATE_LABEL_TO_VALUE[clickedLabel];
				if (stateValue) {
					console.log('Applying fallback filter to object list: state=' + stateValue);
					setProperties(snEmbedxObjectList, {
						editQuery: OBJECT_LIST_BASE_QUERY + '^state=' + stateValue,
						refreshRequest: Date.now()
					});
				}
			}
		},
		'NOW_VIS_WRAPPER#CLICKED' : (e) => {
			// Dispatched when the visualization is clicked
			var {title, type, params, data} = e.detail.payload;
			console.log(title, type, params, data);
		}
	};

	setEvents(snEmbedxVisualizationDonut, eventHandlers);
</script>

<script type="module">
	import { getEmbeddables, setEvents, setProperties } from 'https://nagarrosoftwarepvtltddemo19.service-now.com/uxasset/externals/sn_embeddable_core/index.jsdbx';
	
	const snEmbedxObjectList = document.querySelector('sn-embedx-object-list');
	getEmbeddables(["sn-embedx-object-list"]);
	const eventHandlers = {
		'SN_EMBEDX_OBJECT_LIST#FOOTER_LINK_SELECTED' : (e) => {
			// This event is dispatched when footer link is selected
			var {table, view, edit_query, nest_by} = e.detail.payload;
			const objectListURL = '/objectlist?emb_table=' + table + '&emb_query=' + edit_query + '&emb_view=' + view + '&emb_nestby=' + nest_by;
			open(objectListURL, '_self');
		},
		'SN_EMBEDX_OBJECT_LIST#COMPONENT_ERROR' : (e) => {
			// This event is dispatched when a property validation or internal error occurs.
			var {errorMessage, errorType} = e.detail.payload;
			console.log(errorMessage, errorType);
		},
		'SN_EMBEDX_OBJECT_LIST#RECORD_SELECTED' : (e) => {
			// This event is dispatched when a record is selected.
			var {table, record_sys_id} = e.detail.payload;
			var RecordViewURL;
			if (table == 'sn_customerservice_case') {
				RecordViewURL = '/caseview?emb_table=' + table + '&emb_recordid=' + record_sys_id;
			} else if (table == 'incident') {
				RecordViewURL = '/incidentview?emb_table=' + table + '&emb_recordid=' + record_sys_id;
			} else {
				RecordViewURL = '/recordview?emb_table=' + table + '&emb_recordid=' + record_sys_id;
			}
			open(RecordViewURL, '_self');
		},
		'SN_EMBEDX_OBJECT_LIST#COMPONENT_READY' : (e) => {
			// This event is dispatched when a component is ready and usable.
		}
	};
	setEvents(snEmbedxObjectList, eventHandlers);
</script>
